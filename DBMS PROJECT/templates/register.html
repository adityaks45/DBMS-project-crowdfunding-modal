{% extends "base.html" %}{% block content %}<div class="auth"><h2>Create account</h2><form method="post"><label>Name</label><input class="form-control mb-3" name="name" required><label>Email</label><input class="form-control mb-3" name="email" type="email" required><label>Password (min 6 characters)</label><input class="form-control mb-3" name="password" type="password" minlength="6" required><label>Account type</label><select class="form-select mb-3" name="role"><option>Backer</option><option>Creator</option></select><button class="btn btn-success w-100">Register</button></form></div>{% endblock %}
