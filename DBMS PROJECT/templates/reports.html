{% extends "base.html" %}{% block content %}<h2>Management reports</h2><div class="row g-4 mt-2"><div class="col-md-6"><div class="auth"><h5>Campaigns by status</h5>{% for r in statuses %}<p class="d-flex justify-content-between"><span>{{r.status}}</span><b>{{r.total}}</b></p>{% endfor %}</div></div><div class="col-md-6"><div class="auth"><h5>Top campaigns</h5>{% for r in top %}<p class="d-flex justify-content-between"><span>{{r.title}}</span><b>₹{{"%.2f"|format(r.raised)}}</b></p>{% else %}<p>No pledge data.</p>{% endfor %}</div></div></div>{% endblock %}
