{% extends "base.html" %}{% block content %}<div class="auth wide"><h2>Create campaign</h2><form method="post"><label>Title</label><input class="form-control mb-3" name="title" required><label>Purpose</label><textarea class="form-control mb-3" name="purpose" rows="4" required></textarea><label>Goal amount (₹)</label><input class="form-control mb-3" type="number" min="1" step=".01" name="goal" required><label>End date</label><input class="form-control mb-3" type="date" name="end_date"><button class="btn btn-success">Submit for approval</button></form></div>{% endblock %}
